<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadence Reminder</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 520px;
        margin: 4rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      button {
        padding: 0.6rem 0.9rem;
        border: 0;
        border-radius: 6px;
        background: #0f172a;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    {% if completed %}
    <h1>Task completed</h1>
    <p>{{ task_name }} has been marked complete.</p>
    {% else %}
    <h1>Complete task?</h1>
    <p>Mark <strong>{{ task_name }}</strong> complete now.</p>
    <form method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}" />
      <button type="submit">Mark complete</button>
    </form>
    {% endif %}
  </body>
</html>
